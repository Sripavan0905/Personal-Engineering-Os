<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d0c" />
    <meta name="description" content="A calm, focused engineering learning workspace." />
    <title>Personal Engineering OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .filter-row { grid-template-columns: 1.3fr 1fr 1fr 1fr; }
      @media (max-width: 680px) { .filter-row { grid-template-columns: 1fr; } }

      /* Light mode has its own paper-and-sage landing treatment. */
      body.light .hero { background: #eef1e9; }
      body.light .hero-video { display: none; }
      body.light .hero-fallback { background: radial-gradient(circle at 79% 22%, rgba(119, 151, 109, .34), transparent 19%), radial-gradient(circle at 72% 45%, rgba(227, 193, 138, .27), transparent 14%), linear-gradient(132deg, #f8f5ee, #e7eee3 53%, #f0e8d9); }
      body.light .hero-fallback::before { background: repeating-radial-gradient(circle, rgba(73, 103, 78, .14) 0 1px, transparent 1px 28px); }
      body.light .hero-fallback::after { background: linear-gradient(160deg, transparent 12%, rgba(90, 110, 99, .10) 13%), repeating-linear-gradient(90deg, rgba(78, 112, 82, .11) 0 2px, transparent 2px 82px); }
      body.light .hero-overlay { background: rgba(247, 245, 240, .32); backdrop-filter: blur(2px); }
      body.light .hero h1 { color: #1c2621; }
      body.light .hero h1 em { color: #55754e; }
      body.light .hero-copy { color: #405047; }
      body.light .hero .eyebrow { color: #48654e; }
      body.light .quote-card { color: #1c2621; background: rgba(255, 253, 248, .70); border-color: rgba(43, 69, 51, .18); }
      body.light .quote-text { color: #25362d; }
      body.light .quote-by, body.light .path-card span:last-child, body.light .landing-footer { color: #5d6c63; }
      body.light .path-card { color: #1c2621; background: rgba(255, 253, 248, .68); border-color: rgba(43, 69, 51, .18); }
      body.light .path-card:hover { background: #fffdf8; border-color: #5a8063; }
      body.light .path-label { color: #55754e; }
      body.light .button.ghost { color: #26392d; border-color: rgba(43, 69, 51, .28); background: rgba(255, 253, 248, .56); }
      body.light .button.ghost:hover { background: #fffdf8; }
      body.light .scale-button.active { background: #55754e !important; color: #fffdf8 !important; border-color: #55754e !important; }

      .info-page { min-height: 100vh; background: radial-gradient(circle at 88% 12%, rgba(115, 150, 106, .16), transparent 24%), var(--bg); }
      .info-main { padding: 72px 0 64px; }
      .info-hero { max-width: 790px; }
      .info-hero h1 { font-size: clamp(2.5rem, 5vw, 4.7rem); margin: 17px 0; letter-spacing: -.07em; }
      .info-hero > p { max-width: 680px; color: var(--muted); line-height: 1.75; }
      .info-actions { display: flex; gap: 11px; margin-top: 25px; }
      .info-ghost { background: var(--surface) !important; color: var(--ink) !important; border-color: var(--border) !important; }
      .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 47px; }
      .info-grid.two-up { grid-template-columns: repeat(2, 1fr); }
      .info-card { min-height: 210px; padding: 22px; }
      .info-card h3, .summary-strip h3 { margin: 13px 0 8px; font-size: 1.1rem; letter-spacing: -.045em; }
      .info-card p, .summary-strip p { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.7; }
      .contact-line { color: var(--sage) !important; font-family: "DM Mono", monospace; font-size: .68rem !important; margin-top: 17px !important; }
      .summary-strip { margin-top: 14px; padding: 22px; display: flex; gap: 20px; align-items: center; justify-content: space-between; }
      .contact-form { max-width: 710px; margin-top: 27px; padding: 21px; }
      .contact-form .button { width: auto; margin-top: 14px; }
      .form-hint { color: var(--muted); font-size: .64rem; margin: 11px 0 0; }
      .notify-option { grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); cursor: pointer; }
      .notify-option input { margin-top: 3px; accent-color: var(--sage); }
      .notify-option strong, .notify-option small { display: block; }
      .notify-option strong { font-size: .74rem; color: var(--ink); }
      .notify-option small { margin-top: 3px; color: var(--muted); font-size: .64rem; line-height: 1.45; }
      .form-error { min-height: 19px; color: var(--danger); font-size: .7rem; margin-top: 10px; }
      .settings-list { display: grid; gap: 9px; margin-top: 20px; }
      .settings-list .button { margin-top: 8px; }
      @media (max-width: 680px) { .public-menu { display: none; } .info-main { padding: 42px 0; } .info-grid, .info-grid.two-up { grid-template-columns: 1fr; margin-top: 30px; } .summary-strip { align-items: flex-start; flex-direction: column; } .info-actions { flex-wrap: wrap; } }
    </style>
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <main id="app"></main>
    <div id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="app.js"></script>
  </body>
</html>
